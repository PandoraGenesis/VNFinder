name = "vnfinder-chat"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Thêm origin của bản triển khai thật; giữ localhost để thử nghiệm
ALLOWED_ORIGINS = "https://pandoragenesis.github.io,http://localhost:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
MODEL = "gemini-2.5-flash"

# Khóa API KHÔNG ghi ở đây. Chạy:  wrangler secret put GEMINI_API_KEY
# (có thể xóa secret cũ:           wrangler secret delete ANTHROPIC_API_KEY)
